[project]
name = "navigator"
version = "0.1.0"
description = "Climate and nature risk platform for Apetit: recipes, review and lineage"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "minio>=7.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "psycopg[binary]>=3.2",
    "pyarrow==25.0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scipy==1.15.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]
notebooks = [
    "ipykernel==7.3.0",
    "matplotlib==3.10.9",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
# Strict everywhere in the package except the analysis modules, which came from the notebooks
# as they were and are checked in basic mode until they are typed.
strict = [
    "src/navigator/api",
    "src/navigator/db",
    "src/navigator/recipes",
    "src/navigator/steps",
    "src/navigator/storage",
    "src/navigator/worker",
    "src/navigator/agents",
    "src/navigator/llm",
    "src/navigator/settings.py",
    "src/navigator/ids.py",
    "src/navigator/logs.py",
    "src/navigator/seed.py",
]
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: reproduces the notebooks' results",
    "api: needs Postgres and the S3 store",
]
