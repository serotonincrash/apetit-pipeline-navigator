# One file for every machine.
#   Laptop, shared dev services:  docker compose --profile dev up -d      (Postgres and SeaweedFS)
#   Vultr VM, the whole app:      COMPOSE_PROFILES=app in .env, then docker compose up -d
name: navigator

x-backend: &backend
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://navigator:${POSTGRES_PASSWORD}@postgres:5432/navigator
    S3_ENDPOINT: seaweedfs:8333
    PACKAGE_DIR: /package
  # The API needs the package too: scripts/reset_demo.sh reseeds from inside it.
  volumes: ["${PACKAGE_DIR}:/package:ro"]
  depends_on:
    postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    profiles: [dev, app]
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: navigator
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "navigator"]
      interval: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    profiles: [dev, app]
    # SeaweedFS reads S3 credentials from a JSON file; write it from the environment at start.
    # Each bucket takes several volumes, so allow many small ones (one pair of buckets per worktree).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"navigator","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -volume.max=200 -master.volumeSizeLimitMB=128
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:8333:8333"]
    volumes: [seaweedfs:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 20

  seed:
    <<: *backend
    profiles: [app]
    command: sh -c "alembic upgrade head && python -m navigator.seed"
    restart: "no"

  api:
    <<: *backend
    profiles: [app]
    command: uvicorn navigator.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    <<: *backend
    profiles: [app]
    command: python -m navigator.worker.main
    depends_on:
      seed:
        condition: service_completed_successfully

  caddy:
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
    profiles: [app]
    environment:
      DOMAIN: ${DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy:/data
    depends_on: [api]

volumes:
  postgres:
  seaweedfs:
  caddy:
